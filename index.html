<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>효명고등학교 실시간 방명록</title>
  <meta name="description" content="효명고등학교 학생 및 교직원을 위한 따뜻한 실시간 온라인 방명록">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 데코레이션 그라디언트 -->
  <div class="bg-blur circle-1"></div>
  <div class="bg-blur circle-2"></div>

  <div class="app-container">
    <!-- 헤더 영역 -->
    <header class="main-header">
      <div class="logo-area">
        <span class="school-badge">🏫 효명고등학교</span>
        <h1 class="main-title">우리들의 실시간 방명록</h1>
        <p class="sub-title">효명인(@hmh.or.kr)이 함께 나누는 따뜻한 한마디</p>
      </div>

      <!-- 로그인 / 사용자 프로필 영역 -->
      <div class="auth-area">
        <!-- 로그인 전 상태 -->
        <div id="logged-out-view" class="auth-box">
          <button id="btn-login" class="btn-google-login" type="button">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>효명고 계정으로 로그인</span>
          </button>
        </div>

        <!-- 로그인 후 상태 (기본은 숨김) -->
        <div id="logged-in-view" class="auth-box is-hidden">
          <div class="user-badge">
            <span class="user-avatar" id="user-avatar">👤</span>
            <div class="user-info">
              <span class="user-name" id="user-display-name">홍길동</span>
              <span class="school-tag">효명고 인증됨 (@hmh.or.kr)</span>
            </div>
          </div>
          <button id="btn-logout" class="btn-logout" type="button">로그아웃</button>
        </div>
      </div>
    </header>

    <!-- 도메인 안내 배너 -->
    <div class="domain-notice-banner">
      <span class="notice-icon">📢</span>
      <span class="notice-text">
        <strong>효명고 공식 계정(@hmh.or.kr)</strong> 전용 방명록입니다. 학생 및 교직원의 성과 이름이 작성자로 자동 등록됩니다.
      </span>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="content-layout">
      <!-- 1. 방명록 작성 섹션 -->
      <section class="form-section">
        <div class="card-box form-card">
          <h2 class="section-title">✏️ 따뜻한 메시지 남기기</h2>
          <form id="guestbook-form" class="guestbook-form">
            <!-- 작성자 이름 (자동 고정 & 읽기 전용) -->
            <div class="input-group">
              <label for="author-name">작성자 (성과 이름)</label>
              <div class="input-with-badge">
                <input 
                  type="text" 
                  id="author-name" 
                  name="authorName" 
                  placeholder="로그인하면 효명고 계정의 성명이 자동으로 입력됩니다" 
                  readonly 
                  required
                >
                <span class="lock-indicator" title="성과 이름은 자동으로 고정됩니다">🔒 실명 인증</span>
              </div>
            </div>

            <!-- 메시지 내용 -->
            <div class="input-group">
              <label for="message-content">응원과 안부의 메시지</label>
              <textarea 
                id="message-content" 
                name="messageContent" 
                rows="3" 
                maxlength="300" 
                placeholder="친구들과 선생님께 전하고 싶은 응원의 한마디를 적어보세요! (최대 300자)" 
                required
              ></textarea>
              <div class="char-counter"><span id="char-count">0</span> / 300자</div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">
              <span>방명록 남기기 ✨</span>
            </button>
          </form>
        </div>
      </section>

      <!-- 2. 실시간 방명록 목록 섹션 -->
      <section class="list-section">
        <div class="list-header">
          <h2 class="section-title">💬 효명인들의 이야기 <span class="message-count" id="message-count">(0)</span></h2>
          <span class="realtime-status"><span class="pulse-dot"></span> 실시간 소통 중</span>
        </div>

        <div id="messages-container" class="messages-container">
          <!-- 카드가 자바스크립트로 동적으로 추가됩니다 -->
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer class="main-footer">
      <p>🏫 효명고등학교 실시간 디지털 방명록 &copy; 2026</p>
      <p class="footer-sub">건축주: 효명고 선생님 &bull; 시공사: AI 에이전트 페어 프로그래밍</p>
    </footer>
  </div>

  <!-- JavaScript 로직 연결 (Firebase 모듈 스크립트) -->
  <script type="module" src="app.js"></script>

  <!-- file:// 로 직접 열었을 때 친절한 안내 스크립트 -->
  <script>
    if (window.location.protocol === 'file:') {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:14px;text-align:center;font-weight:bold;z-index:99999;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
      banner.innerHTML = '⚠️ 현재 파일을 직접 열어 브라우저 보안(CORS) 때문에 로그인이 작동하지 않습니다. <br>주소창에 <b>http://localhost:58488</b> 로 접속하시거나 VS Code 우측 하단의 [Go Live]를 눌러주세요!';
      document.body.prepend(banner);
    }
  </script>
</body>
</html>
